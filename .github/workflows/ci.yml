name: Python CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reseller
          POSTGRES_USER: reseller
          POSTGRES_PASSWORD: testing-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reseller -d reseller" --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "ci-only-not-for-production"
      POSTGRES_HOST: localhost
      POSTGRES_DB: reseller
      POSTGRES_USER: reseller
      POSTGRES_PASSWORD: testing-only
      POSTGRES_SSLMODE: disable
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      SALES_ENABLED: "false"
      FULFILLMENT_ENABLED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test shop --verbosity 2
      - run: python -m compileall -q config shop
  backup-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: command -v gpg
      - run: python -m unittest scripts.backups.test_database_backup -v
      - run: docker pull postgres:16-alpine
      - run: python scripts/backups/backup_restore_drill.py
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.0
      - run: python -m pip_audit --strict --require-hashes --disable-pip -r requirements.lock
